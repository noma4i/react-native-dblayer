name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check JSDoc
        run: node scripts/check-jsdoc.mjs

      - name: Test
        run: yarn test
